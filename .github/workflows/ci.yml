name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mongodb-memory-server downloads a mongod binary on first use. Caching
      # it keeps the test job from re-downloading on every run.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check documented scripts exist
        run: npm run check:docs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build imports modules that read these at module scope. Real
          # values are not needed to compile, only to run.
          MONGODB_URI: mongodb://localhost:27017/build
          ANTHROPIC_API_KEY: build-placeholder
          CLERK_SECRET_KEY: sk_test_build_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_build_placeholder
          CLERK_WEBHOOK_SIGNING_SECRET: whsec_build_placeholder
          RESEND_API_KEY: re_build_placeholder
          RESEND_FROM_EMAIL: noreply@example.com
